[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-road-collision-severity-prediction"
version = "0.1.0"
description = "Reproducible analysis and temporal modeling of UK road collision severity"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
